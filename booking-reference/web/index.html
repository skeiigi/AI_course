<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Сервис бронирования тайм-слотов: выберите вид активности и свободное время." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4ee" />
    <script>
      try {
        const savedTheme = localStorage.getItem('booking.theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        }
        const isDark = savedTheme === 'dark' ||
          (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#101d1a' : '#f3f4ee';
      } catch {
        // Недоступное хранилище не мешает открыть страницу.
      }
    </script>
    <title>Бронирование тайм-слотов</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
