# Настройки инструментов проекта.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E и W это стиль, F это ошибки, I это порядок импортов,
# B это типовые ошибки, UP это устаревший синтаксис.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Depends и Query в значениях по умолчанию это обычный приём FastAPI, а не ошибка.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
