# Проверка проекта при каждом изменении: линтер и тесты.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Линтер и тесты
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверить стиль кода
        run: ruff check .

      - name: Проверить форматирование
        run: ruff format --check .

      - name: Запустить тесты
        run: pytest -q
