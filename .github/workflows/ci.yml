# Проверка проекта booking-reference при каждом изменении.
#
# Этот файл — копия booking-reference/.github/workflows/ci.yml,
# поднятая в корень репозитория, потому что GitHub Actions читает
# только .github/workflows/*.yml в корне репо.
#
# Три задачи. Первая собирает контракт и проверяет, что закоммиченный
# openapi.yaml совпадает с тем, что выдаёт компилятор, потом проверяет типы
# и гоняет модульные и интеграционные тесты. Вторая гоняет сквозные тесты
# в настоящем браузере. Третья собирает образ Docker.
name: booking-reference CI

on:
  push:
    branches: [main]
    paths:
      - 'booking-reference/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'booking-reference/**'
      - '.github/workflows/ci.yml'

env:
  NODE_VERSION: "22"

defaults:
  run:
    working-directory: booking-reference

jobs:
  check:
    name: Контракт, типы и тесты
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: booking-reference/package-lock.json

      - name: Установить зависимости
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Пересобрать контракт из TypeSpec
        run: npm run contract:build

      - name: Проверить, что openapi.yaml в репозитории совпадает со сборкой
        run: git diff --exit-code -- booking-reference/contract/openapi.yaml

      - name: Проверить типы
        run: npm run typecheck

      - name: Модульные и интеграционные тесты
        run: npm test

      - name: Собрать интерфейс
        run: npm run build --workspace web

  e2e:
    name: Сквозные тесты
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: booking-reference/package-lock.json

      - name: Установить зависимости
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Поставить браузер для Playwright
        run: npx playwright install --with-deps chromium
        working-directory: booking-reference/e2e

      - name: Собрать сервис и интерфейс
        run: npm run build

      - name: Запустить сквозные тесты
        run: npm run e2e

      - name: Сохранить отчёт, если тесты упали
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: booking-reference/e2e/test-results
          retention-days: 7

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Собрать образ
        run: docker build --tag booking-reference:ci booking-reference
